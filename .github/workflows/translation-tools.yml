name: Translation tooling

on:
  pull_request:
    paths:
      - ".agents/skills/translation-checker/**"
      - ".agents/skills/translation-semantic-review/**"
      - ".agents/skills/upstream-sync/**"
      - ".env.example"
      - ".gitmodules"
      - ".github/workflows/translation-tools.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".agents/skills/translation-checker/**"
      - ".agents/skills/translation-semantic-review/**"
      - ".agents/skills/upstream-sync/**"
      - ".env.example"
      - ".gitmodules"
      - ".github/workflows/translation-tools.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  behavior:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: git submodule update --init -- en-us
      - run: uv sync --locked --managed-python
      - run: uv run --locked --offline deepl-cli --help
      - run: uv run --locked --offline translation-check --strict --summary-only
      - run: uv run --locked --offline deepl-cli review --plan --files alternatives
      - run: uv run --locked --offline translation-update --mode deepl --plan --files alternatives/claude.mdx
      - run: uv run --locked --offline restamp-exceptions --help
      - run: uv run --locked --offline python -m unittest discover -s .agents/skills/translation-checker/scripts -p "test_*.py" -v
