name: Translation tooling

on:
  pull_request:
    paths:
      - ".agents/skills/translation-checker/**"
      - ".agents/skills/translation-semantic-review/**"
      - ".agents/skills/upstream-sync/**"
      - ".env.example"
      - ".github/workflows/translation-tools.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/translation-checker/**"
      - ".agents/skills/translation-semantic-review/**"
      - ".agents/skills/upstream-sync/**"
      - ".github/workflows/translation-tools.yml"
  workflow_dispatch:

jobs:
  behavior:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r .agents/skills/translation-checker/requirements.txt
      - run: python -m unittest discover -s .agents/skills/translation-checker/scripts -p "test_*.py" -v
